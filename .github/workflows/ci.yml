name: CI

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm pack --dry-run
      - run: node -e "import('./dist/index.js').then(m => { const keys = Object.keys(m); ['LotrClient','LotrError','NotFoundError','AuthenticationError','RateLimitError','ApiResponseError','NetworkError'].forEach(k => { if (!keys.includes(k)) throw new Error(k + ' not exported'); }); console.log('smoke ok:', keys.join(', ')); })"
